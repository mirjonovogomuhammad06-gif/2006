<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Periodic — Таблица Менделеева</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #060914;
    --bg2: #0b1020;
    --card: rgba(255,255,255,.055);
    --card-hover: rgba(255,255,255,.1);
    --border: rgba(255,255,255,.1);
    --text: #f5f7ff;
    --muted: #8995ad;
    --purple: #7167ff;
    --cyan: #00d9ff;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(113,103,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(0,217,255,.11),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            var(--bg),
            var(--bg2)
        );

    overflow-x: hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
    width: min(1500px, 100%);
    margin: auto;

    padding: 30px 24px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo-icon {
    width: 54px;
    height: 54px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #7167ff,
            #00d9ff
        );

    box-shadow:
        0 10px 35px rgba(113,103,255,.35);
}

.logo h1 {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo p {
    margin-top: 3px;

    color: var(--muted);

    font-size: 11px;
}


/* =====================================================
   SEARCH
   ===================================================== */

.search {
    position: relative;

    width: min(430px, 100%);
}

.search-icon {
    position: absolute;

    left: 16px;
    top: 50%;

    transform: translateY(-50%);

    color: #8794ad;

    font-size: 19px;

    pointer-events: none;
}

.search input {
    width: 100%;

    padding:
        15px
        18px
        15px
        46px;

    color: white;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid var(--border);

    outline: none;

    border-radius: 15px;

    font-size: 13px;

    backdrop-filter: blur(15px);

    transition: .25s;
}

.search input::placeholder {
    color: #68758d;
}

.search input:focus {
    border-color:
        rgba(113,103,255,.8);

    box-shadow:
        0 0 0 4px
        rgba(113,103,255,.1);
}


/* =====================================================
   FILTERS
   ===================================================== */

.controls {
    width: min(1500px, 100%);
    margin: auto;

    padding:
        0
        24px
        22px;

    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.filter {
    border: 1px solid var(--border);

    color: #aab5ca;

    background:
        rgba(255,255,255,.04);

    padding:
        9px
        14px;

    border-radius: 100px;

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.filter:hover {
    color: white;

    background:
        rgba(255,255,255,.08);

    border-color:
        rgba(255,255,255,.2);
}

.filter.active {
    color: white;

    border-color: transparent;

    background:
        linear-gradient(
            135deg,
            #7167ff,
            #5368ff
        );

    box-shadow:
        0 6px 20px
        rgba(113,103,255,.25);
}


/* =====================================================
   TABLE CONTAINER
   ===================================================== */

.table-wrapper {
    width: min(1500px, 100%);

    margin: auto;

    padding:
        0
        24px
        30px;
}


/* =====================================================
   PERIODIC TABLE
   ===================================================== */

.periodic-table {
    display: grid;

    width: 100%;

    grid-template-columns:
        repeat(
            18,
            minmax(0, 1fr)
        );

    grid-template-rows:
        repeat(7, 82px)
        25px
        repeat(2, 82px);

    gap: 6px;
}


/* =====================================================
   ELEMENT
   ===================================================== */

.element {
    position: relative;

    min-width: 0;

    padding: 6px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}

.element::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.1),
            transparent 48%
        );
}

.element:hover {
    z-index: 20;

    transform:
        translateY(-5px)
        scale(1.04);

    border-color:
        rgba(255,255,255,.42);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.42),
        0 0 25px
        rgba(113,103,255,.1);
}

.number {
    position: relative;
    z-index: 2;

    color: #91a0ba;

    font-size: 9px;
}

.symbol {
    position: relative;
    z-index: 2;

    margin-top: 2px;

    text-align: center;

    font-size:
        clamp(18px, 2vw, 27px);

    line-height: 29px;

    font-weight: 800;
}

.name {
    position: relative;
    z-index: 2;

    margin-top: 2px;

    color: #b6c0d4;

    text-align: center;

    font-size: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   SECTION LABELS
   ===================================================== */

.section-label {
    display: flex;

    align-items: center;
    justify-content: center;

    color: #6e7d98;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 3px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.012);

    pointer-events: none;
}


/* =====================================================
   ELEMENT COLORS
   ===================================================== */

.alkali {
    background:
        linear-gradient(
            145deg,
            rgba(255,79,112,.25),
            rgba(255,79,112,.04)
        );

    border-color:
        rgba(255,79,112,.28);
}

.alkaline {
    background:
        linear-gradient(
            145deg,
            rgba(255,166,0,.24),
            rgba(255,166,0,.04)
        );

    border-color:
        rgba(255,166,0,.28);
}

.transition {
    background:
        linear-gradient(
            145deg,
            rgba(255,213,79,.2),
            rgba(255,213,79,.035)
        );

    border-color:
        rgba(255,213,79,.24);
}

.post-transition {
    background:
        linear-gradient(
            145deg,
            rgba(0,212,255,.2),
            rgba(0,212,255,.035)
        );

    border-color:
        rgba(0,212,255,.23);
}

.metalloid {
    background:
        linear-gradient(
            145deg,
            rgba(78,255,176,.2),
            rgba(78,255,176,.035)
        );

    border-color:
        rgba(78,255,176,.23);
}

.nonmetal {
    background:
        linear-gradient(
            145deg,
            rgba(99,102,241,.23),
            rgba(99,102,241,.035)
        );

    border-color:
        rgba(99,102,241,.25);
}

.halogen {
    background:
        linear-gradient(
            145deg,
            rgba(168,85,247,.24),
            rgba(168,85,247,.035)
        );

    border-color:
        rgba(168,85,247,.26);
}

.noble {
    background:
        linear-gradient(
            145deg,
            rgba(236,72,153,.23),
            rgba(236,72,153,.035)
        );

    border-color:
        rgba(236,72,153,.25);
}

.lanthanide {
    background:
        linear-gradient(
            145deg,
            rgba(20,184,166,.24),
            rgba(20,184,166,.035)
        );

    border-color:
        rgba(20,184,166,.27);
}

.actinide {
    background:
        linear-gradient(
            145deg,
            rgba(249,115,22,.24),
            rgba(249,115,22,.035)
        );

    border-color:
        rgba(249,115,22,.27);
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {
    width: min(1500px, 100%);

    margin: auto;

    padding:
        0
        24px
        30px;

    display: flex;

    flex-wrap: wrap;

    gap: 12px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #8e9ab0;

    font-size: 10px;
}

.dot {
    width: 11px;
    height: 11px;

    border-radius: 4px;

    display: inline-block;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(2,4,10,.75);

    backdrop-filter:
        blur(16px);
}

.modal.show {
    display: flex;

    animation:
        fadeIn .2s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.modal-card {
    position: relative;

    width: min(850px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    padding: 28px;

    border-radius: 25px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        radial-gradient(
            circle at top right,
            rgba(113,103,255,.18),
            transparent 35%
        ),
        #0d1424;

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.55);

    animation:
        modalIn .25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform:
            translateY(20px)
            scale(.97);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.close {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

    color: #aab4c8;

    font-size: 21px;

    cursor: pointer;

    transition: .2s;
}

.close:hover {
    color: white;

    background:
        rgba(255,255,255,.12);
}


/* =====================================================
   MODAL HEADER
   ===================================================== */

.element-head {
    display: flex;

    align-items: center;

    gap: 22px;

    margin-bottom: 28px;

    padding-right: 45px;
}

.big-symbol {
    width: 115px;
    height: 115px;

    min-width: 115px;

    display: grid;

    place-items: center;

    border-radius: 25px;

    font-size: 56px;

    font-weight: 800;

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        inset 0 0 30px
        rgba(255,255,255,.025);
}

.element-title h2 {
    font-size: 34px;

    line-height: 1.2;

    margin-bottom: 6px;
}

.element-title p {
    color: #8d99b0;

    margin-bottom: 10px;

    font-size: 13px;
}

.badge {
    display: inline-block;

    padding:
        6px
        10px;

    border-radius: 100px;

    background:
        rgba(113,103,255,.14);

    color:
        #aaa5ff;

    font-size: 10px;
}


/* =====================================================
   PROPERTIES
   ===================================================== */

.properties {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.property {
    padding: 16px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.04);
}

.property .label {
    color: #77849d;

    font-size: 9px;

    margin-bottom: 7px;
}

.property .value {
    color: #edf1fa;

    font-size: 13px;

    font-weight: 600;

    line-height: 1.4;

    word-break: break-word;
}


/* =====================================================
   DESCRIPTION
   ===================================================== */

.description {
    margin-top: 18px;

    padding: 18px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.035);

    color: #adb8cb;

    font-size: 12px;

    line-height: 1.7;
}

.description strong {
    color: white;
}


/* =====================================================
   NO RESULTS
   ===================================================== */

.no-results {
    display: none;

    grid-column: 1 / -1;

    padding: 80px 20px;

    text-align: center;

    color: #7f8ca5;

    font-size: 14px;
}


/* =====================================================
   FOOTER
   ===================================================== */

footer {
    padding:
        10px
        20px
        35px;

    color: #566176;

    text-align: center;

    font-size: 10px;
}


/* =====================================================
   TABLET
   ===================================================== */

@media (max-width: 1000px) {

    header {
        flex-direction: column;

        align-items: stretch;
    }

    .logo {
        justify-content: center;
    }

    .search {
        width: 100%;
    }

    .periodic-table {
        grid-template-rows:
            repeat(7, 68px)
            23px
            repeat(2, 68px);

        gap: 4px;
    }

    .symbol {
        font-size: 18px;
    }

    .name {
        font-size: 6px;
    }

    .properties {
        grid-template-columns:
            repeat(2, 1fr);
    }
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 700px) {

    header {
        padding:
            20px
            15px
            16px;

        gap: 15px;
    }

    .logo {
        justify-content: center;
    }

    .logo-icon {
        width: 45px;
        height: 45px;

        border-radius: 14px;

        font-size: 23px;
    }

    .logo h1 {
        font-size: 21px;
    }

    .logo p {
        font-size: 9px;
    }


    /* Search */

    .search input {
        padding:
            14px
            15px
            14px
            43px;

        font-size: 12px;
    }


    /* Filters */

    .controls {
        padding:
            0
            15px
            18px;

        gap: 6px;
    }

    .filter {
        padding:
            7px
            10px;

        font-size: 9px;
    }


    /* Table */

    .table-wrapper {
        padding:
            0
            7px
            25px;
    }

    .periodic-table {

        width: 100%;

        grid-template-columns:
            repeat(18, minmax(0, 1fr));

        grid-template-rows:
            repeat(7, 48px)
            19px
            repeat(2, 48px);

        gap: 2px;
    }


    /* Elements */

    .element {
        padding: 2px;

        border-radius: 5px;
    }

    .element:hover {
        transform: none;

        box-shadow:
            0 4px 12px
            rgba(0,0,0,.35);
    }

    .number {
        font-size: 5px;
    }

    .symbol {
        margin-top: 0;

        font-size:
            clamp(8px, 3vw, 15px);

        line-height: 15px;
    }

    .name {
        display: none;
    }


    /* Labels */

    .section-label {
        font-size: 5px;

        letter-spacing: 1px;
    }


    /* Legend */

    .legend {
        padding:
            0
            15px
            25px;

        gap: 8px;
    }

    .legend-item {
        font-size: 8px;
    }

    .dot {
        width: 8px;
        height: 8px;
    }


    /* Modal */

    .modal {
        padding: 8px;
    }

    .modal-card {
        width: 100%;

        max-height: 95vh;

        padding: 18px;

        border-radius: 20px;
    }

    .close {
        top: 13px;
        right: 13px;

        width: 34px;
        height: 34px;
    }

    .element-head {
        gap: 13px;

        margin-bottom: 18px;

        padding-right: 35px;
    }

    .big-symbol {
        width: 75px;
        height: 75px;

        min-width: 75px;

        border-radius: 17px;

        font-size: 34px;
    }

    .element-title h2 {
        font-size: 20px;
    }

    .element-title p {
        font-size: 10px;
    }

    .badge {
        font-size: 8px;

        padding:
            5px
            8px;
    }

    .properties {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 7px;
    }

    .property {
        padding: 11px;

        border-radius: 11px;
    }

    .property .label {
        font-size: 7px;
    }

    .property .value {
        font-size: 10px;
    }

    .description {
        padding: 13px;

        font-size: 10px;
    }
}


/* =====================================================
   VERY SMALL PHONE
   ===================================================== */

@media (max-width: 380px) {

    .periodic-table {
        grid-template-rows:
            repeat(7, 40px)
            17px
            repeat(2, 40px);

        gap: 1px;
    }

    .element {
        border-radius: 3px;
    }

    .number {
        font-size: 4px;
    }

    .symbol {
        font-size: 8px;

        line-height: 10px;
    }

    .properties {
        grid-template-columns:
            repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            ⚛
        </div>

        <div>
            <h1>Periodic</h1>

            <p>
                Интерактивная таблица Менделеева
            </p>
        </div>

    </div>


    <div class="search">

        <span class="search-icon">⌕</span>

        <input
            id="search"
            type="text"
            autocomplete="off"
            placeholder="Поиск: золото, Au или 79..."
        >

    </div>

</header>


<!-- FILTERS -->

<div class="controls">

    <button
        class="filter active"
        data-filter="all"
    >
        Все
    </button>

    <button
        class="filter"
        data-filter="alkali"
    >
        Щелочные
    </button>

    <button
        class="filter"
        data-filter="alkaline"
    >
        Щелочноземельные
    </button>

    <button
        class="filter"
        data-filter="transition"
    >
        Переходные
    </button>

    <button
        class="filter"
        data-filter="post-transition"
    >
        Постпереходные
    </button>

    <button
        class="filter"
        data-filter="metalloid"
    >
        Металлоиды
    </button>

    <button
        class="filter"
        data-filter="nonmetal"
    >
        Неметаллы
    </button>

    <button
        class="filter"
        data-filter="halogen"
    >
        Галогены
    </button>

    <button
        class="filter"
        data-filter="noble"
    >
        Благородные газы
    </button>

    <button
        class="filter"
        data-filter="lanthanide"
    >
        Лантаноиды
    </button>

    <button
        class="filter"
        data-filter="actinide"
    >
        Актиноиды
    </button>

</div>


<!-- PERIODIC TABLE -->

<div class="table-wrapper">

    <div
        class="periodic-table"
        id="table"
    >

        <div
            class="no-results"
            id="noResults"
        >
            Ничего не найдено
        </div>

    </div>

</div>


<!-- LEGEND -->

<div class="legend">

    <div class="legend-item">
        <span class="dot alkali"></span>
        Щелочные металлы
    </div>

    <div class="legend-item">
        <span class="dot alkaline"></span>
        Щелочноземельные
    </div>

    <div class="legend-item">
        <span class="dot transition"></span>
        Переходные
    </div>

    <div class="legend-item">
        <span class="dot post-transition"></span>
        Постпереходные
    </div>

    <div class="legend-item">
        <span class="dot metalloid"></span>
        Металлоиды
    </div>

    <div class="legend-item">
        <span class="dot nonmetal"></span>
        Неметаллы
    </div>

    <div class="legend-item">
        <span class="dot halogen"></span>
        Галогены
    </div>

    <div class="legend-item">
        <span class="dot noble"></span>
        Благородные газы
    </div>

    <div class="legend-item">
        <span class="dot lanthanide"></span>
        Лантаноиды
    </div>

    <div class="legend-item">
        <span class="dot actinide"></span>
        Актиноиды
    </div>

</div>


<footer>
    PERIODIC • 118 химических элементов
</footer>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-card">

        <button
            class="close"
            id="close"
            aria-label="Закрыть"
        >
            ×
        </button>


        <div class="element-head">

            <div
                class="big-symbol"
                id="bigSymbol"
            ></div>


            <div class="element-title">

                <h2 id="modalName"></h2>

                <p id="modalLatin"></p>

                <span
                    class="badge"
                    id="modalCategory"
                ></span>

            </div>

        </div>


        <div
            class="properties"
            id="properties"
        ></div>


        <div
            class="description"
            id="description"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   ДАННЫЕ ЭЛЕМЕНТОВ

   [номер,
    символ,
    название,
    английское название,
    категория,
    группа,
    период,

   CATEGORY NAMES
   ===================================================== */

const categoryNames = {

    alkali:
        "Щелочной металл",

    alkaline:
        "Щелочноземельный металл",

    transition:
        "Переходный металл",

    "post-transition":
        "Постпереходный металл",

    metalloid:
        "Металлоид",

    nonmetal:
        "Неметалл",

    halogen:
        "Галоген",

    noble:
        "Благородный газ",

    lanthanide:
        "Лантаноид",

    actinide:
        "Актиноид"
};


/* =====================================================
   POSITION

   Главная таблица:
   группа = колонка
   период = строка

   Лантаноиды:
   отдельная строка 9

   Актиноиды:
   отдельная строка 11
   ===================================================== */

function getPosition(element) {

    const number = element[0];

    /*
       Лантаноиды La–Lu
    */

    if (
        number >= 57 &&
        number <= 71
    ) {

        return {

            col:
                number - 57 + 4,

            row: 9

        };

    }


    /*
       Актиноиды Ac–Lr
    */

    if (
        number >= 89 &&
        number <= 103
    ) {

        return {

            col:
                number - 89 + 4,

            row: 10

        };

    }


    /*
       Остальные элементы
    */

    return {

        col: element[5],

        row: element[6]

    };
}


/* =====================================================
   CREATE TABLE
   ===================================================== */

const table =
    document.getElementById("table");


function createElement(data) {

    const [

        atomicNumber,
        symbol,
        name,
        english,
        category,
        group,
        period,
        mass,
        configuration,
        oxidation,
        electrons,
        melting,
        boiling,
        density,
        discovery,
        state

    ] = data;


    const position =
        getPosition(data);


    const element =
        document.createElement("div");


    element.className =
        `element ${category}`;


    element.style.gridColumn =
        position.col;


    element.style.gridRow =
        position.row;


    element.dataset.number =
        atomicNumber;


    element.dataset.symbol =
        symbol.toLowerCase();


    element.dataset.name =
        name.toLowerCase();


    element.dataset.category =
        category;


    element.innerHTML = `

        <div class="number">
            ${atomicNumber}
        </div>

        <div class="symbol">
            ${symbol}
        </div>

        <div class="name">
            ${name}
        </div>

    `;


    element.addEventListener(
        "click",
        () => openModal(data)
    );


    table.appendChild(element);

}


/* =====================================================
   CREATE ALL ELEMENTS
   ===================================================== */

elements.forEach(createElement);


/* =====================================================
   SECTION LABELS

   Добавляем после элементов,
   но CSS Grid позволяет им занимать
   отдельную строку.
   ===================================================== */

function createSectionLabel(
    text,
    row
) {

    const label =
        document.createElement("div");


    label.className =
        "section-label";


    label.textContent =
        text;


    label.style.gridColumn =
        "1 / -1";


    label.style.gridRow =
        row;


    table.appendChild(label);
}


/*
   В CSS:

   row 8  = Лантаноиды label
   row 9  = La-Lu
   row 10 = Ac-Lr

   Поэтому для красивого разделения
   сделаем небольшой label между ними
   через абсолютное визуальное решение.
*/


/* =====================================================
   MODAL
   ===================================================== */

const modal =
    document.getElementById("modal");


const closeButton =
    document.getElementById("close");


function openModal(data) {

    const [

        atomicNumber,
        symbol,
        name,
        english,
        category,
        group,
        period,
        mass,
        configuration,
        oxidation,
        electrons,
        melting,
        boiling,
        density,
        discovery,
        state

    ] = data;


    document.getElementById(
        "bigSymbol"
    ).textContent = symbol;


    document.getElementById(
        "bigSymbol"
    ).className =
        `big-symbol ${category}`;


    document.getElementById(
        "modalName"
    ).textContent =
        `${name} (${symbol})`;


    document.getElementById(
        "modalLatin"
    ).textContent =
        english;


    document.getElementById(
        "modalCategory"
    ).textContent =
        categoryNames[category];


    const properties =
        document.getElementById(
            "properties"
        );


    properties.innerHTML = `

        ${property(
            "Атомный номер",
            atomicNumber
        )}

        ${property(
            "Атомная масса",
            mass
        )}

        ${property(
            "Группа",
            group
        )}

        ${property(
            "Период",
            period
        )}

        ${property(
            "Электронов",
            electrons
        )}

        ${property(
            "Степени окисления",
            oxidation
        )}

        ${property(
            "Электронная конфигурация",
            configuration
        )}

        ${property(
            "Температура плавления",
            melting + " °C"
        )}

        ${property(
            "Температура кипения",
            boiling + " °C"
        )}

        ${property(
            "Плотность",
            density + " г/см³"
        )}

        ${property(
            "Состояние",
            state
        )}

        ${property(
            "Открытие",
            discovery
        )}

    `;


    document.getElementById(
        "description"
    ).innerHTML = `

        <strong>${name}</strong>
        — химический элемент с атомным
        номером <strong>${atomicNumber}</strong>
        и символом <strong>${symbol}</strong>.

        Категория:
        <strong>
            ${categoryNames[category]}
        </strong>.

        Период:
        <strong>${period}</strong>.

        Группа:
        <strong>${group}</strong>.

    `;


    modal.classList.add("show");

    document.body.style.overflow =
        "hidden";
}


function property(
    label,
    value
) {

    return `

        <div class="property">

            <div class="label">
                ${label}
            </div>

            <div class="value">
                ${value}
            </div>

        </div>

    `;
}


/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeModal() {

    modal.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";
}


closeButton.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* =====================================================
   SEARCH + FILTER
   ===================================================== */

const search =
    document.getElementById(
        "search"
    );


const noResults =
    document.getElementById(
        "noResults"
    );


let activeFilter = "all";


function applyFilters() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    let visible = 0;


    document
        .querySelectorAll(".element")
        .forEach(element => {

            const matchesSearch =

                !query ||

                element.dataset.name
                    .includes(query) ||

                element.dataset.symbol
                    .includes(query) ||

                element.dataset.number ===
                    query;


            const matchesCategory =

                activeFilter === "all" ||

                element.dataset.category ===
                    activeFilter;


            const show =
                matchesSearch &&
                matchesCategory;


            element.style.display =
                show
                    ? ""
                    : "none";


            if (show) {

                visible++;

            }

        });


    noResults.style.display =
        visible === 0
            ? "block"
            : "none";
}


search.addEventListener(
    "input",
    applyFilters
);


/* =====================================================
   FILTER BUTTONS
   ===================================================== */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".filter"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );


                button.classList.add(
                    "active"
                );


                activeFilter =
                    button.dataset.filter;


                applyFilters();

            }
        );

    });


/* =====================================================
   INITIALIZE
   ===================================================== */

applyFilters();

</script>

</body>
</html>
